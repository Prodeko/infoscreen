worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;

        # Serve the React build files
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # Serve the event JSON file
        location /data/ {
            alias /app/data/;
        }

        # Proxy configuration for Kanttiinit API
        location /kanttiinitproxy/ {
            proxy_pass https://kitchen.kanttiinit.fi/;
            proxy_ssl_server_name on;
            proxy_set_header Host kitchen.kanttiinit.fi;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
